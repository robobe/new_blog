<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">YOLO metrics</title>
  <desc id="desc">A detection box, an IoU overlap, and a rising metric curve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="180" height="180" rx="24" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="25" y="31" width="77" height="72" rx="5" fill="#22c55e" fill-opacity=".12" stroke="#4ade80" stroke-width="4"/>
    <rect x="55" y="54" width="79" height="72" rx="5" fill="#38bdf8" fill-opacity=".15" stroke="#38bdf8" stroke-width="4"/>
    <rect x="55" y="54" width="47" height="49" fill="#a78bfa" fill-opacity=".45"/>
  </g>
  <path d="M22 150 L52 136 L78 141 L107 113 L135 104 L158 76" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="158" cy="76" r="6" fill="#fbbf24"/>
  <text x="90" y="166" fill="#fff" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">mAP • IoU • PR</text>
</svg>
