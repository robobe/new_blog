<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Precision recall curve and confusion matrix</title><desc id="desc">An annotated precision recall curve beside a normalized three-class confusion matrix.</desc>
  <rect width="1100" height="520" rx="18" fill="#f8fafc"/>
  <g font-family="sans-serif">
    <text x="265" y="45" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">Precision–Recall curve</text>
    <path d="M72 76 V432 H492" fill="none" stroke="#334155" stroke-width="3"/>
    <text x="282" y="480" text-anchor="middle" font-size="18">Recall</text><text x="28" y="255" text-anchor="middle" font-size="18" transform="rotate(-90 28 255)">Precision</text>
    <g fill="#475569" font-size="14"><text x="60" y="438">0</text><text x="482" y="453">1</text><text x="52" y="88">1</text></g>
    <path d="M73 86 C150 88 210 104 267 143 C330 187 363 244 405 327 C436 385 463 411 491 427 L73 427Z" fill="#c4b5fd" fill-opacity=".42"/>
    <path d="M73 86 C150 88 210 104 267 143 C330 187 363 244 405 327 C436 385 463 411 491 427" fill="none" stroke="#7c3aed" stroke-width="6"/>
    <text x="217" y="286" font-size="21" font-weight="700" fill="#6d28d9">AP = area under curve</text>
    <text x="265" y="505" text-anchor="middle" font-size="15" fill="#64748b">Closer to the top-right is better</text>
    <text x="815" y="45" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">Normalized confusion matrix</text>
    <g transform="translate(635 92)">
      <g stroke="#fff" stroke-width="3"><rect width="110" height="110" fill="#312e81"/><rect x="110" width="110" height="110" fill="#ddd6fe"/><rect x="220" width="110" height="110" fill="#ede9fe"/><rect y="110" width="110" height="110" fill="#e9d5ff"/><rect x="110" y="110" width="110" height="110" fill="#4c1d95"/><rect x="220" y="110" width="110" height="110" fill="#f3e8ff"/><rect y="220" width="110" height="110" fill="#f3e8ff"/><rect x="110" y="220" width="110" height="110" fill="#ddd6fe"/><rect x="220" y="220" width="110" height="110" fill="#5b21b6"/></g>
      <g text-anchor="middle" font-size="24" font-weight="700"><text x="55" y="66" fill="#fff">0.91</text><text x="165" y="66">0.06</text><text x="275" y="66">0.03</text><text x="55" y="176">0.08</text><text x="165" y="176" fill="#fff">0.86</text><text x="275" y="176">0.06</text><text x="55" y="286">0.02</text><text x="165" y="286">0.09</text><text x="275" y="286" fill="#fff">0.89</text></g>
      <g text-anchor="middle" font-size="16"><text x="55" y="355">person</text><text x="165" y="355">car</text><text x="275" y="355">dog</text><text x="165" y="386" font-weight="700">True class</text></g>
      <g text-anchor="middle" font-size="16" transform="translate(-28 165) rotate(-90)"><text x="0" y="0" font-weight="700">Predicted class</text></g>
    </g>
    <text x="815" y="505" text-anchor="middle" font-size="15" fill="#64748b">Strong diagonal = correct classes; off-diagonal = confusion</text>
  </g>
</svg>
