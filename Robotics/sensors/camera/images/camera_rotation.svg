<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">Rotate the relative world vector into the camera frame</title><desc id="d">The camera orientation changes the coordinates used to describe the same point.</desc><rect width="900" height="430" rx="18" fill="#f7f9fb"/>
  <circle cx="360" cy="275" r="10" fill="#222"/><circle cx="680" cy="95" r="10" fill="#222"/><path d="M360 275L680 95" stroke="#e67e22" stroke-width="4"/>
  <g stroke-width="5"><path d="M360 275L470 275" stroke="#c0392b"/><path d="M360 275L420 370" stroke="#218c3a"/><path d="M360 275L535 175" stroke="#2467c9"/></g>
  <path d="M445 275A85 85 0 0 0 430 225" fill="none" stroke="#8e44ad" stroke-width="4"/>
  <g font-family="sans-serif" fill="#17202a" font-size="19"><text x="290" y="245">camera C</text><text x="650" y="70">point P</text><text x="470" y="215">Pc = Rcw(Pw − Cw)</text><text x="450" y="315" fill="#c0392b">Xc right</text><text x="405" y="395" fill="#218c3a">Yc down</text><text x="520" y="160" fill="#2467c9">Zc forward</text><text x="25" y="405" fill="#e67e22">orange = point ray</text><text x="190" y="405" fill="#8e44ad">purple arc = rotation</text></g>
</svg>
