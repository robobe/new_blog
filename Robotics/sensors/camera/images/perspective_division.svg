<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">Perspective division</title><desc id="d">Near and far points on the same ray share normalized image coordinates after division by depth.</desc><rect width="900" height="430" rx="18" fill="#f7f9fb"/>
  <circle cx="120" cy="270" r="9" fill="#222"/><line x1="120" y1="270" x2="820" y2="270" stroke="#2467c9" stroke-width="3"/><rect x="330" y="80" width="7" height="260" fill="#00a8b5"/><path d="M120 270L760 100" stroke="#e67e22" stroke-width="4"/><circle cx="500" cy="169" r="10" fill="#222"/><circle cx="760" cy="100" r="10" fill="#222"/><circle cx="333" cy="213" r="8" fill="#222"/>
  <g font-family="sans-serif" fill="#17202a" font-size="19"><text x="75" y="245">C</text><text x="475" y="145">near</text><text x="740" y="75">far</text><text x="350" y="205">same x=Xc/Zc</text><text x="380" y="55">normalized plane Z=1</text><text x="25" y="400" fill="#e67e22">orange = shared ray</text><text x="210" y="400" fill="#2467c9">blue = Zc</text><text x="320" y="400" fill="#00a8b5">cyan = normalized plane</text></g>
</svg>
