<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">Map normalized coordinates to pixels</title><desc id="d">Focal lengths scale normalized coordinates and the principal point shifts the origin to pixel coordinates.</desc><rect width="900" height="430" rx="18" fill="#f7f9fb"/>
  <rect x="230" y="55" width="440" height="300" fill="#dff7fa" stroke="#00a8b5" stroke-width="4"/><path d="M230 55H670M230 55V355" stroke="#596275" stroke-width="3"/><circle cx="450" cy="205" r="8" fill="#8e44ad"/><circle cx="560" cy="145" r="10" fill="#222"/><path d="M450 205L560 145" stroke="#e67e22" stroke-width="4"/>
  <g font-family="sans-serif" fill="#17202a" font-size="19"><text x="235" y="45">(0,0)</text><text x="390" y="225">principal point (cx,cy)</text><text x="575" y="135">pixel (u,v)</text><text x="300" y="390">u = fx x + cx</text><text x="510" y="390">v = fy y + cy</text><text x="25" y="415" fill="#e67e22">orange = scale and shift</text><text x="250" y="415" fill="#8e44ad">purple = principal point</text><text x="480" y="415" fill="#00a8b5">cyan = image</text></g>
</svg>
