<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual capacitor voltage and inrush current waveforms</title>
  <desc id="desc">Two graphs share a time axis. Capacitor voltage rises exponentially toward the supply voltage while charging current begins at its maximum and decays toward zero. Markers identify connection time, one time constant, and five time constants.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .axis { stroke: #334155; stroke-width: 2.5; }
      .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 5 6; }
      .marker { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .voltage { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; }
      .supply { fill: none; stroke: #0f766e; stroke-width: 3; stroke-dasharray: 9 6; }
      .current { fill: none; stroke: #dc2626; stroke-width: 5; stroke-linecap: round; }
      .label { font: 21px sans-serif; fill: #0f172a; }
      .small { font: 17px sans-serif; fill: #475569; }
      .heading { font: 700 25px sans-serif; fill: #0f172a; }
      .blue { fill: #2563eb; }
      .red { fill: #dc2626; }
      .teal { fill: #0f766e; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="620"/>
  <text x="500" y="38" text-anchor="middle" class="heading">Capacitor charging after power connection</text>

  <rect class="panel" x="90" y="65" width="850" height="220" rx="10"/>
  <rect class="panel" x="90" y="330" width="850" height="220" rx="10"/>

  <!-- Shared time markers -->
  <line class="marker" x1="155" y1="65" x2="155" y2="550"/>
  <line class="marker" x1="310" y1="65" x2="310" y2="550"/>
  <line class="marker" x1="865" y1="65" x2="865" y2="550"/>

  <!-- Voltage panel axes and grid -->
  <line class="axis" x1="125" y1="250" x2="915" y2="250" marker-end="url(#arrow)"/>
  <line class="axis" x1="125" y1="255" x2="125" y2="92" marker-end="url(#arrow)"/>
  <line class="grid" x1="125" y1="120" x2="915" y2="120"/>
  <line class="grid" x1="125" y1="168" x2="915" y2="168"/>

  <!-- Supply step and capacitor rise -->
  <path class="supply" d="M 125 250 L 155 250 L 155 105 L 915 105"/>
  <path class="voltage" d="M 125 250 L 155 250 C 205 250, 250 207, 310 158 C 430 110, 640 106, 915 105"/>
  <circle cx="310" cy="158" r="6" class="blue"/>

  <text x="105" y="84" class="heading">Voltage</text>
  <text x="900" y="97" text-anchor="end" class="small teal">Supply voltage</text>
  <text x="900" y="142" text-anchor="end" class="small blue">Capacitor voltage V<tspan baseline-shift="sub" font-size="13">C</tspan></text>
  <text x="300" y="148" text-anchor="end" class="small blue">≈63%</text>
  <text x="113" y="256" text-anchor="end" class="small">0</text>

  <!-- Current panel axes and grid -->
  <line class="axis" x1="125" y1="515" x2="915" y2="515" marker-end="url(#arrow)"/>
  <line class="axis" x1="125" y1="520" x2="125" y2="357" marker-end="url(#arrow)"/>
  <line class="grid" x1="125" y1="385" x2="915" y2="385"/>
  <line class="grid" x1="125" y1="445" x2="915" y2="445"/>

  <!-- Current spike and decay -->
  <path class="current" d="M 125 515 L 155 515 L 155 370 C 205 404, 250 447, 310 478 C 430 511, 650 515, 915 515"/>
  <circle cx="155" cy="370" r="6" class="red"/>
  <circle cx="310" cy="478" r="6" class="red"/>

  <text x="105" y="349" class="heading">Current</text>
  <text x="170" y="365" class="small red">Peak I<tspan baseline-shift="sub" font-size="13">0</tspan></text>
  <text x="900" y="500" text-anchor="end" class="small red">Charging current</text>
  <text x="113" y="521" text-anchor="end" class="small">0</text>

  <!-- Shared labels -->
  <text x="155" y="580" text-anchor="middle" class="small">connection</text>
  <text x="310" y="580" text-anchor="middle" class="small">1τ</text>
  <text x="865" y="580" text-anchor="middle" class="small">5τ</text>
  <text x="925" y="580" text-anchor="end" class="label">time →</text>
  <text x="500" y="608" text-anchor="middle" class="small">Conceptual RC curves — not measured data</text>
</svg>
