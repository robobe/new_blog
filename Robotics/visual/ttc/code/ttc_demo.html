<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual TTC demo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #111827; color: #e5e7eb; }
    canvas { width: 100%; height: 330px; display: block; border: 1px solid #374151; border-radius: 8px; background: #0b1220; }
    .readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 8px; margin: 12px 0; }
    .readout { padding: 8px 10px; border-radius: 6px; background: #1f2937; }
    .label { color: #9ca3af; font-size: 12px; }
    .value { display: block; margin-top: 2px; color: #f9fafb; font: 600 17px ui-monospace, monospace; }
    .controls { display: flex; gap: 8px; align-items: center; }
    button { padding: 8px 14px; border: 1px solid #4b5563; border-radius: 6px; background: #374151; color: #fff; cursor: pointer; }
    button:hover, button:focus-visible { background: #4b5563; }
    #status { color: #93c5fd; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="scene" role="img" aria-label="Side and camera views of an object approaching a camera"></canvas>

  <div class="readouts">
    <div class="readout"><span class="label">Elapsed</span><span class="value" id="elapsed">0.00 s</span></div>
    <div class="readout"><span class="label">Distance Z</span><span class="value" id="distance">10.00 m</span></div>
    <div class="readout"><span class="label">Image width w</span><span class="value" id="width">60.0 px</span></div>
    <div class="readout"><span class="label">Actual TTC</span><span class="value" id="actual">5.00 s</span></div>
    <div class="readout"><span class="label">Estimated TTC</span><span class="value" id="estimated">—</span></div>
  </div>

  <div class="controls">
    <button id="toggle" type="button">Start</button>
    <button id="reset" type="button">Reset</button>
    <span id="status" aria-live="polite">Ready</span>
  </div>

  <script>
    const initialDistance = 10;
    const closingSpeed = 2;
    const objectWidth = 2;
    const focalLength = 300;
    const samplePeriod = 0.25;
    const collisionTime = initialDistance / closingSpeed;

    const canvas = document.querySelector("#scene");
    const ctx = canvas.getContext("2d");
    const toggleButton = document.querySelector("#toggle");
    const status = document.querySelector("#status");
    const output = Object.fromEntries(
      ["elapsed", "distance", "width", "actual", "estimated"].map(id => [id, document.querySelector(`#${id}`)])
    );

    let elapsed = 0;
    let startedAt = 0;
    let running = false;
    let nextSample = 0;
    let previousSample = null;
    let currentSample = null;
    let estimatedTtc = null;

    const imageWidth = distance => focalLength * objectWidth / Math.max(distance, 0.05);
    const estimateTtc = (dt, w0, w1) => dt * w0 / (w1 - w0);

    console.assert(Math.abs(estimateTtc(0.1, 80, 100) - 0.4) < 1e-12, "TTC formula check failed");

    function sampleUntil(time) {
      while (nextSample <= time && nextSample < collisionTime) {
        const sample = { time: nextSample, width: imageWidth(initialDistance - closingSpeed * nextSample) };
        if (currentSample) {
          previousSample = currentSample;
          estimatedTtc = estimateTtc(sample.time - previousSample.time, previousSample.width, sample.width);
        }
        currentSample = sample;
        nextSample += samplePeriod;
      }
    }

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.round(rect.width * ratio);
      canvas.height = Math.round(rect.height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      draw();
    }

    function draw() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const half = width / 2;
      const distance = Math.max(0, initialDistance - closingSpeed * elapsed);
      const projected = imageWidth(distance);

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#d1d5db";
      ctx.font = "600 15px system-ui";
      ctx.fillText("Side view", 16, 25);
      ctx.fillText("Camera image", half + 16, 25);

      ctx.strokeStyle = "#374151";
      ctx.beginPath();
      ctx.moveTo(half, 0);
      ctx.lineTo(half, height);
      ctx.stroke();

      const cameraX = 42;
      const trackEnd = Math.max(cameraX + 40, half - 35);
      const objectX = cameraX + distance / initialDistance * (trackEnd - cameraX);
      const groundY = height * 0.58;

      ctx.strokeStyle = "#6b7280";
      ctx.beginPath();
      ctx.moveTo(cameraX, groundY);
      ctx.lineTo(trackEnd, groundY);
      ctx.stroke();

      ctx.fillStyle = "#60a5fa";
      ctx.fillRect(cameraX - 7, groundY - 25, 7, 50);
      ctx.fillStyle = "#9ca3af";
      ctx.font = "12px system-ui";
      ctx.fillText("camera", 14, groundY + 44);

      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(objectX - 6, groundY - 48, 12, 96);
      ctx.fillStyle = "#fbbf24";
      ctx.fillText("object", Math.min(objectX - 20, half - 55), groundY - 58);

      ctx.strokeStyle = "#60a5fa";
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.moveTo(objectX, groundY - 48);
      ctx.lineTo(cameraX, groundY - 12);
      ctx.moveTo(objectX, groundY + 48);
      ctx.lineTo(cameraX, groundY + 12);
      ctx.stroke();
      ctx.setLineDash([]);

      const viewCenterX = half + half / 2;
      const viewCenterY = height * 0.55;
      const maxBoxWidth = Math.max(30, half - 34);
      const boxWidth = Math.min(projected, maxBoxWidth);
      const boxHeight = Math.min(boxWidth * 0.65, height - 95);

      if (currentSample) {
        const sampledWidth = Math.min(currentSample.width, maxBoxWidth);
        ctx.strokeStyle = "#9ca3af";
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(viewCenterX - sampledWidth / 2, viewCenterY - sampledWidth * 0.325, sampledWidth, sampledWidth * 0.65);
        ctx.setLineDash([]);
      }

      ctx.fillStyle = "rgba(245, 158, 11, 0.7)";
      ctx.fillRect(viewCenterX - boxWidth / 2, viewCenterY - boxHeight / 2, boxWidth, boxHeight);
      ctx.strokeStyle = "#fbbf24";
      ctx.strokeRect(viewCenterX - boxWidth / 2, viewCenterY - boxHeight / 2, boxWidth, boxHeight);

      ctx.fillStyle = "#9ca3af";
      ctx.fillText("dashed: latest TTC sample", half + 16, height - 18);

      output.elapsed.textContent = `${elapsed.toFixed(2)} s`;
      output.distance.textContent = `${distance.toFixed(2)} m`;
      output.width.textContent = distance === 0 ? "∞" : `${projected.toFixed(1)} px`;
      output.actual.textContent = `${(distance / closingSpeed).toFixed(2)} s`;
      output.estimated.textContent = estimatedTtc === null ? "—" : `${Math.max(0, estimatedTtc).toFixed(2)} s`;
    }

    function animate(now) {
      if (!running) return;
      elapsed = Math.min((now - startedAt) / 1000, collisionTime);
      sampleUntil(elapsed);
      draw();

      if (elapsed >= collisionTime) {
        running = false;
        estimatedTtc = 0;
        toggleButton.textContent = "Start";
        status.textContent = "Collision";
        draw();
        return;
      }
      requestAnimationFrame(animate);
    }

    toggleButton.addEventListener("click", () => {
      if (elapsed >= collisionTime) reset();
      running = !running;
      toggleButton.textContent = running ? "Pause" : "Start";
      status.textContent = running ? "Running" : "Paused";
      if (running) {
        startedAt = performance.now() - elapsed * 1000;
        requestAnimationFrame(animate);
      }
    });

    function reset() {
      running = false;
      elapsed = 0;
      nextSample = 0;
      previousSample = null;
      currentSample = null;
      estimatedTtc = null;
      toggleButton.textContent = "Start";
      status.textContent = "Ready";
      sampleUntil(0);
      draw();
    }

    document.querySelector("#reset").addEventListener("click", reset);
    new ResizeObserver(resizeCanvas).observe(canvas);
    reset();
  </script>
</body>
</html>
