<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">IoU and detection matching example</title>
  <desc id="desc">A stylized street image with a ground truth box and predicted box around a car, illustrating intersection and union.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b9e6ff"/><stop offset="1" stop-color="#f5fbff"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#667085"/><stop offset="1" stop-color="#344054"/></linearGradient>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#8b5cf6" fill-opacity=".24"/><line x1="0" y1="0" x2="0" y2="12" stroke="#8b5cf6" stroke-width="4" stroke-opacity=".65"/></pattern>
  </defs>
  <rect width="1000" height="560" rx="18" fill="#fff"/>
  <rect x="25" y="25" width="620" height="470" rx="14" fill="url(#sky)"/>
  <path d="M25 290 L645 230 L645 495 L25 495Z" fill="url(#road)"/>
  <path d="M38 407 L625 307" stroke="#f8fafc" stroke-width="10" stroke-dasharray="52 34" opacity=".85"/>
  <rect x="64" y="192" width="110" height="126" fill="#d6d3d1"/><rect x="82" y="212" width="25" height="33" fill="#64748b"/><rect x="125" y="212" width="25" height="33" fill="#64748b"/>
  <circle cx="346" cy="402" r="34" fill="#111827"/><circle cx="533" cy="371" r="34" fill="#111827"/>
  <path d="M285 365 L331 291 L486 272 L561 332 L568 391 L282 428Z" fill="#e11d48" stroke="#881337" stroke-width="5"/>
  <path d="M352 302 L473 287 L520 329 L326 350Z" fill="#bfdbfe" opacity=".9"/>
  <rect x="252" y="250" width="335" height="202" rx="3" fill="#22c55e" fill-opacity=".08" stroke="#16a34a" stroke-width="6"/>
  <rect x="291" y="276" width="330" height="192" rx="3" fill="#38bdf8" fill-opacity=".09" stroke="#0284c7" stroke-width="6"/>
  <rect x="291" y="276" width="296" height="176" fill="url(#hatch)"/>
  <rect x="252" y="216" width="250" height="34" rx="6" fill="#16a34a"/><text x="266" y="239" fill="#fff" font-family="sans-serif" font-size="19" font-weight="700">Ground truth: car</text>
  <rect x="391" y="468" width="230" height="34" rx="6" fill="#0284c7"/><text x="405" y="491" fill="#fff" font-family="sans-serif" font-size="19" font-weight="700">Prediction: car 0.87</text>
  <g font-family="sans-serif" fill="#101828">
    <text x="681" y="72" font-size="28" font-weight="700">Intersection over Union</text>
    <text x="681" y="116" font-size="20">IoU = overlap ÷ combined area</text>
    <rect x="682" y="146" width="34" height="24" fill="#8b5cf6" fill-opacity=".5"/><text x="730" y="165" font-size="18">Intersection</text>
    <rect x="682" y="190" width="34" height="24" fill="#22c55e" fill-opacity=".18" stroke="#16a34a" stroke-width="2"/><text x="730" y="209" font-size="18">Ground-truth area</text>
    <rect x="682" y="234" width="34" height="24" fill="#38bdf8" fill-opacity=".18" stroke="#0284c7" stroke-width="2"/><text x="730" y="253" font-size="18">Predicted area</text>
    <text x="681" y="314" font-size="22" font-weight="700">Example IoU: 0.68</text>
    <rect x="681" y="338" width="275" height="54" rx="10" fill="#dcfce7"/>
    <text x="699" y="372" font-size="20" font-weight="700" fill="#166534">IoU ≥ 0.50 → location match</text>
    <text x="681" y="429" font-size="18">Correct class + unmatched label</text>
    <text x="681" y="455" font-size="18">+ enough confidence → true positive</text>
  </g>
</svg>
