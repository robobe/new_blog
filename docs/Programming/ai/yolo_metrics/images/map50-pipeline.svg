<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">How mAP50 is calculated</title><desc id="desc">A five-step flow from predictions to mean average precision at IoU 0.50.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
  <rect width="1100" height="390" rx="20" fill="#f8fafc"/>
  <rect x="0" y="0" width="1100" height="66" rx="20" fill="url(#head)"/><rect x="0" y="45" width="1100" height="21" fill="url(#head)"/>
  <text x="550" y="43" fill="#fff" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">mAP50: from boxes to one dataset score</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(30 108)"><rect width="180" height="205" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="90" cy="42" r="24" fill="#dbeafe"/><text x="90" y="50" font-size="23" font-weight="700" fill="#1d4ed8">1</text><text x="90" y="93" font-size="18" font-weight="700">Sort predictions</text><text x="90" y="121" font-size="15" fill="#475569">Highest confidence first</text><text x="90" y="151" font-size="15" fill="#475569">0.96, 0.87, 0.72…</text></g>
    <g transform="translate(245 108)"><rect width="180" height="205" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="90" cy="42" r="24" fill="#dcfce7"/><text x="90" y="50" font-size="23" font-weight="700" fill="#15803d">2</text><text x="90" y="93" font-size="18" font-weight="700">Match at IoU .50</text><text x="90" y="121" font-size="15" fill="#475569">One prediction per label</text><text x="90" y="151" font-size="15" fill="#475569">Mark TP or FP</text></g>
    <g transform="translate(460 108)"><rect width="180" height="205" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="90" cy="42" r="24" fill="#fef3c7"/><text x="90" y="50" font-size="23" font-weight="700" fill="#b45309">3</text><text x="90" y="93" font-size="18" font-weight="700">Build P–R curve</text><text x="90" y="121" font-size="15" fill="#475569">Sweep confidence</text><path d="M38 178 Q75 124 139 170" fill="none" stroke="#f59e0b" stroke-width="5"/></g>
    <g transform="translate(675 108)"><rect width="180" height="205" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="90" cy="42" r="24" fill="#fce7f3"/><text x="90" y="50" font-size="23" font-weight="700" fill="#be185d">4</text><text x="90" y="93" font-size="18" font-weight="700">AP per class</text><text x="90" y="121" font-size="15" fill="#475569">Area under P–R curve</text><text x="90" y="165" font-size="24" font-weight="700" fill="#be185d">AP₅₀</text></g>
    <g transform="translate(890 108)"><rect width="180" height="205" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="3"/><circle cx="90" cy="42" r="24" fill="#ede9fe"/><text x="90" y="50" font-size="23" font-weight="700" fill="#6d28d9">5</text><text x="90" y="93" font-size="18" font-weight="700">Mean over classes</text><text x="90" y="121" font-size="15" fill="#475569">Equal class weighting</text><text x="90" y="165" font-size="25" font-weight="800" fill="#6d28d9">mAP50</text></g>
  </g>
  <g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"><path d="M212 210 H238"/><path d="M427 210 H453"/><path d="M642 210 H668"/><path d="M857 210 H883"/></g>
  <text x="550" y="354" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">IoU 0.50 is the matching rule—not the confidence threshold.</text>
</svg>
