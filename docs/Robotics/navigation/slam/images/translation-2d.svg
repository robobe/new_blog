<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc">
  <title id="title">2D coordinate frames and translation</title>
  <desc id="desc">World origin at zero, robot origin at world coordinates 3, 2. Parallel x and y axes. Landmark P has robot coordinates 2, 1 and world coordinates 5, 3. All coordinates are in meters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker>
  </defs>
  <rect width="700" height="400" rx="12" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="17" fill="#0f172a">
    <text x="24" y="30" font-weight="bold">2D: same point, two coordinate frames</text>
    <g fill="none" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M80 330H600" stroke="#b91c1c"/>
      <path d="M80 330V65" stroke="#15803d"/>
      <path d="M320 210H555" stroke="#b91c1c"/>
      <path d="M320 210V65" stroke="#15803d"/>
      <path d="M80 330 320 210" stroke="#7c3aed"/>
      <path d="M320 210 480 150" stroke="#334155"/>
    </g>
    <path d="M480 150V330M80 150H480" fill="none" stroke="#94a3b8" stroke-dasharray="5 5"/>
    <circle cx="80" cy="330" r="5" fill="#0f172a"/>
    <circle cx="320" cy="210" r="5" fill="#7c3aed"/>
    <circle cx="480" cy="150" r="6" fill="#0f172a"/>
    <text x="605" y="336">x_W</text><text x="48" y="60">y_W</text>
    <text x="563" y="216">x_R</text><text x="327" y="65">y_R</text>
    <text x="45" y="361">W: (0, 0)</text>
    <text x="326" y="237">R: (3, 2) in W</text>
    <text x="126" y="246" fill="#6d28d9">t_WR = (3, 2)</text>
    <text x="368" y="126">p_R = (2, 1)</text>
    <text x="494" y="147" font-weight="bold">P</text>
    <text x="494" y="174">p_W = (5, 3)</text>
    <text x="26" y="389" font-size="15">Axes stay parallel. Purple arrow: world origin → robot origin. Units: meters.</text>
  </g>
</svg>
