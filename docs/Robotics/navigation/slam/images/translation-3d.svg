<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" role="img" aria-labelledby="title desc">
  <title id="title">3D coordinate frames and translation</title>
  <desc id="desc">Two aligned right-handed frames projected onto the page. The robot origin is at world coordinates 3, 2, 1. Landmark P is at robot coordinates 2, 1, 2 and world coordinates 5, 3, 3. All coordinates are in meters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker>
  </defs>
  <rect width="700" height="450" rx="12" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="17" fill="#0f172a">
    <text x="24" y="30" font-weight="bold">3D: add a third coordinate</text>
    <g fill="none" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M200 340 356 388M362 272 518 320" stroke="#b91c1c"/>
      <path d="M200 340 74 403M362 272 236 335" stroke="#15803d"/>
      <path d="M200 340V180M362 272V112" stroke="#1d4ed8"/>
      <path d="M200 340 362 272" stroke="#7c3aed"/>
      <path d="M362 272 479 181" stroke="#334155"/>
    </g>
    <path d="M362 272 518 320 479 339 479 181" fill="none" stroke="#64748b" stroke-dasharray="5 5"/>
    <circle cx="200" cy="340" r="5" fill="#0f172a"/>
    <circle cx="362" cy="272" r="5" fill="#7c3aed"/>
    <circle cx="479" cy="181" r="6" fill="#0f172a"/>
    <text x="360" y="405">x_W</text><text x="32" y="407">y_W</text><text x="166" y="173">z_W</text>
    <text x="529" y="326">x_R</text><text x="206" y="355">y_R</text><text x="369" y="109">z_R</text>
    <text x="96" y="326">W: (0, 0, 0)</text>
    <text x="330" y="365">R: (3, 2, 1) in W</text>
    <text x="185" y="269" fill="#6d28d9">t_WR = (3, 2, 1)</text>
    <text x="380" y="153">p_R = (2, 1, 2)</text>
    <text x="494" y="182" font-weight="bold">P</text>
    <text x="494" y="209">p_W = (5, 3, 3)</text>
    <text x="24" y="436" font-size="15">x: red · y: green · z: blue. Parallel axes; perspective view. Units: meters.</text>
  </g>
</svg>
