<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d">
  <title id="t">Physical pinhole camera</title><desc id="d">Light rays cross at a pinhole and form an inverted image behind it.</desc>
  <rect width="900" height="390" rx="18" fill="#f7f9fb"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#e67e22"/></marker></defs>
  <line x1="70" y1="190" x2="830" y2="190" stroke="#2467c9" stroke-width="2"/><path d="M150 285V95M150 95l-18 30M150 95l18 30" stroke="#222" stroke-width="6" fill="none"/>
  <circle cx="470" cy="190" r="7" fill="#222"/><rect x="690" y="80" width="8" height="220" fill="#8e44ad"/>
  <g stroke="#e67e22" stroke-width="3" marker-end="url(#a)"><path d="M150 95L470 190 694 256"/><path d="M150 285L470 190 694 124"/></g>
  <g font-family="sans-serif" fill="#17202a" font-size="18"><text x="95" y="65">upright object</text><text x="430" y="165">pinhole C</text><text x="650" y="55">physical sensor</text><text x="710" y="260">inverted image</text><text x="25" y="360" fill="#e67e22">orange = light ray</text><text x="180" y="360" fill="#2467c9">blue = optical axis Z</text><text x="360" y="360" fill="#8e44ad">purple = physical image plane</text></g>
</svg>
