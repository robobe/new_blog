<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d">
  <title id="t">Complete world-to-pixel camera pipeline</title><desc id="d">A world point passes through extrinsics, perspective projection, and camera intrinsics to become a pixel.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#e67e22"/></marker></defs>
  <rect width="1000" height="360" rx="18" fill="#f7f9fb"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#17202a">
    <circle cx="85" cy="150" r="12" fill="#222"/><text x="85" y="115" font-size="19">World point</text><text x="85" y="190" font-size="16">Pw = (Xw,Yw,Zw)</text>
    <rect x="195" y="95" width="170" height="110" rx="12" fill="#fff" stroke="#596275" stroke-width="2"/><text x="280" y="130" font-size="20">Extrinsics</text><text x="280" y="160" font-size="16">camera pose R,t</text><text x="280" y="187" font-size="16">world → camera</text>
    <rect x="415" y="95" width="170" height="110" rx="12" fill="#fff" stroke="#596275" stroke-width="2"/><text x="500" y="130" font-size="20">Perspective</text><text x="500" y="160" font-size="16">divide by Zc</text><text x="500" y="187" font-size="16">3D → 2D ray</text>
    <rect x="635" y="95" width="170" height="110" rx="12" fill="#fff" stroke="#596275" stroke-width="2"/><text x="720" y="130" font-size="20">Intrinsics K</text><text x="720" y="160" font-size="16">fx, fy, cx, cy</text><text x="720" y="187" font-size="16">ray → pixels</text>
    <rect x="855" y="110" width="105" height="80" fill="#dff7fa" stroke="#00a8b5" stroke-width="3"/><circle cx="910" cy="148" r="8" fill="#222"/><text x="907" y="225" font-size="19">pixel (u,v)</text>
  </g>
  <g stroke="#e67e22" stroke-width="4" marker-end="url(#a)"><path d="M105 150H190"/><path d="M370 150H410"/><path d="M590 150H630"/><path d="M810 150H850"/></g>
  <g font-family="sans-serif" font-size="14"><text x="25" y="330" fill="#c0392b">X red</text><text x="90" y="330" fill="#218c3a">Y green</text><text x="165" y="330" fill="#2467c9">Z blue</text><text x="240" y="330" fill="#e67e22">orange = projection</text><text x="390" y="330" fill="#00a8b5">cyan = virtual image plane</text></g>
</svg>
