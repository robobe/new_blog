<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">Reverse projection and missing depth</title><desc id="d">A pixel maps to a ray containing many possible 3D points, so depth is required.</desc><rect width="900" height="430" rx="18" fill="#f7f9fb"/>
  <circle cx="120" cy="275" r="10" fill="#222"/><rect x="300" y="90" width="7" height="260" fill="#00a8b5"/><path d="M120 275L825 75" stroke="#e67e22" stroke-width="5" stroke-dasharray="12 8"/><circle cx="303" cy="223" r="8" fill="#222"/><circle cx="460" cy="179" r="11" fill="#222"/><circle cx="620" cy="133" r="11" fill="#222"/><circle cx="780" cy="88" r="11" fill="#222"/>
  <g font-family="sans-serif" fill="#17202a" font-size="19"><text x="70" y="250">camera</text><text x="315" y="215">pixel</text><text x="440" y="155">A</text><text x="600" y="110">B</text><text x="760" y="65">C</text><text x="345" y="325">K⁻¹[u,v,1] gives direction—not distance</text><text x="25" y="400" fill="#e67e22">dashed orange = reverse viewing ray</text><text x="350" y="400" fill="#00a8b5">cyan = image plane</text><text x="570" y="400">A, B, C → same pixel</text></g>
