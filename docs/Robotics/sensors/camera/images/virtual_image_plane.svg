<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d">
  <title id="t">Virtual image plane</title><desc id="d">Computer vision places a virtual image plane in front of the camera to avoid an inverted diagram.</desc>
  <rect width="900" height="390" rx="18" fill="#f7f9fb"/><circle cx="180" cy="195" r="9" fill="#222"/><line x1="180" y1="195" x2="830" y2="195" stroke="#2467c9" stroke-width="3"/><rect x="390" y="70" width="8" height="250" fill="#00a8b5"/>
  <circle cx="650" cy="95" r="10" fill="#222"/><path d="M180 195L650 95" stroke="#e67e22" stroke-width="4"/><circle cx="394" cy="149" r="8" fill="#222"/>
  <g font-family="sans-serif" fill="#17202a" font-size="18"><text x="125" y="165">camera C</text><text x="335" y="50">virtual plane Z=f</text><text x="615" y="70">3D point</text><text x="410" y="140">image point</text><text x="25" y="360" fill="#e67e22">orange = projection ray</text><text x="220" y="360" fill="#2467c9">blue = camera Z axis</text><text x="415" y="360" fill="#00a8b5">cyan = virtual image plane</text></g>
</svg>
