<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d">
  <title id="t">Translation from world to camera coordinates</title><desc id="d">Subtract the camera world position from the point world position.</desc><rect width="900" height="390" rx="18" fill="#f7f9fb"/>
  <line x1="80" y1="300" x2="820" y2="300" stroke="#c0392b" stroke-width="4"/><circle cx="260" cy="300" r="10" fill="#2467c9"/><circle cx="650" cy="130" r="11" fill="#222"/><path d="M260 300L650 130" stroke="#e67e22" stroke-width="4" stroke-dasharray="10 7"/>
  <g font-family="sans-serif" fill="#17202a" font-size="19"><text x="210" y="335">camera at Cw</text><text x="610" y="105">world point Pw</text><text x="420" y="180">Pc = Pw − Cw</text><text x="25" y="365" fill="#c0392b">red = world X</text><text x="180" y="365" fill="#2467c9">blue dot = camera</text><text x="370" y="365" fill="#e67e22">dashed orange = relative vector</text></g>
</svg>
